<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Фильмотека: клиент для учебного REST API" />
  <title>Фильмотека</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./script.js" defer></script>
</head>

<body>
  <header class="page-header">
    <div class="page-header__content">
      <p class="page-header__eyebrow">ДЗ 6 · HTTP и API</p>
      <h1 class="page-header__title">Фильмотека</h1>
      <p class="page-header__lead">
        Каталог фильмов: что уже посмотрено и что хочется посмотреть.
      </p>
    </div>
  </header>

  <main class="workspace">
    <section class="panel panel--collection" aria-labelledby="collection-title">
      <div class="panel__header">
        <div>
          <p class="panel__eyebrow">Коллекция</p>
          <h2 class="panel__title" id="collection-title">Фильмы</h2>
        </div>

        <button class="button button--secondary" type="button" data-action="reload">
          Обновить
        </button>
      </div>

      <p class="endpoint">
        Endpoint:
        <code class="endpoint__value" data-ui="endpoint">http://localhost:3000/films</code>
      </p>

      <div class="status" data-ui="status" role="status" aria-live="polite">
        <strong class="status__title">Ожидание подключения</strong>
        <span class="status__text">Реализуйте первый GET-запрос в script.js.</span>
      </div>

      <div class="collection" data-ui="collection" aria-live="polite"></div>
    </section>

    <section class="panel panel--form" aria-labelledby="form-title">
      <div class="panel__header">
        <div>
          <p class="panel__eyebrow">Новая запись</p>
          <h2 class="panel__title" id="form-title">Добавить фильм</h2>
        </div>
      </div>

      <form class="entry-form" data-form="entry">
        <div class="field">
          <label class="field__label" for="entry-title">Название</label>
          <input class="field__control" id="entry-title" name="title" type="text" minlength="2"
            placeholder="Например, Начало" required />
        </div>

        <div class="field">
